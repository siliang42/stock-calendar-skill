<script>
// date-utils.js — 统一使用浏览器本地时区处理日历日期
function parseLocalDate(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (!match) throw new Error(`Invalid calendar date: ${value}`);
  return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
}
function getLocalToday() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return today;
}
function formatLocalDate(date) {
  const pad = (value) => String(value).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}


// ============================================================
// lunar.js — 农历/节气/节日 纯算法（零依赖，覆盖 1900-2100）
// 核心：基准日偏移法，以 1900-01-31（农历庚子年正月初一）为基准
// ============================================================

// 1900-2099 每年一个 16 位十六进制数：
// 位结构: [闰月大小位:1][大小月:12位][闰月月份:4位]
const LUNAR_INFO = [
  0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2,

  0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950,
  0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557,
  0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5b0, 0x14573, 0x052b0, 0x0a9a8, 0x0e950, 0x06aa0,
  0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0,
  0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b5a0, 0x195a6,
  0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570,
  0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x05ac0, 0x0ab60, 0x096d5, 0x092e0,
  0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5,
  0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930,
  0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530,
  0x05aa0, 0x076a3, 0x096d0, 0x04afb, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45,
  0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0,
  0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0,
  0x092e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4,

  0x0d520
];

const TIAN_GAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
const DI_ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const ZODIAC = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
const MONTH_CN = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
const DAY_CN = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
  '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
  '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

/** 该年闰几月（0 = 无闰月） */
function leapMonth(year) {
  return LUNAR_INFO[year - 1900] & 0xf;
}

/** 该年闰月天数 */
function leapDays(year) {
  if (leapMonth(year)) {
    return (LUNAR_INFO[year - 1900] & 0x10000) ? 30 : 29;
  }
  return 0;
}

/** 某月是大月(30)还是小月(29) */
function monthDays(year, month) {
  return (LUNAR_INFO[year - 1900] & (0x10000 >> month)) ? 30 : 29;
}

/** 农历年总天数 */
function lunarYearDays(year) {
  let sum = 348; // 12 * 29
  for (let i = 0x8000; i > 0x8; i >>= 1) {
    sum += (LUNAR_INFO[year - 1900] & i) ? 1 : 0;
  }
  return sum + leapDays(year);
}

/**
 * 公历 → 农历
 * @param {Date} date
 * @returns {{year:number, month:number, day:number, isLeap:boolean, ganZhiYear:string, zodiac:string, lunarMonth:string, lunarDay:string}}
 */
function solarToLunar(date) {
  // 基准：1900-01-31 = 农历正月初一。
  // 用 UTC 组件计算整天数差，避免本地/UTC 时区导致的 off-by-one。
  const base = Date.UTC(1900, 0, 31);
  const target = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  let offset = Math.floor((target - base) / 86400000);
  if (offset < 0 || offset > 73550) throw new Error('仅支持 1900-2100 年');

  // 1) 逐年扣除
  let year = 1900;
  let temp = 0;
  for (; year < 2100 && offset > 0; year++) {
    temp = lunarYearDays(year);
    offset -= temp;
  }
  if (offset < 0) { offset += temp; year--; }

  // 2) 逐月扣除（含闰月）
  const leap = leapMonth(year);
  let isLeap = false;
  let month = 1;
  for (; month < 13 && offset > 0; month++) {
    if (leap > 0 && month === leap + 1 && !isLeap) {
      --month; isLeap = true; temp = leapDays(year);
    } else {
      temp = monthDays(year, month);
    }
    if (isLeap && month === leap + 1) { isLeap = false; }
    offset -= temp;
  }
  if (offset === 0 && leap > 0 && month === leap + 1) {
    if (isLeap) { isLeap = false; } else { isLeap = true; --month; }
  }
  if (offset < 0) { offset += temp; --month; }
  const day = offset + 1;

  // 3) 干支年 & 生肖（1900 年为庚子年）
  const ganZhiIndex = (year - 1900 + 36) % 60;
  const ganZhiYear = TIAN_GAN[ganZhiIndex % 10] + DI_ZHI[ganZhiIndex % 12];
  const zodiac = ZODIAC[ganZhiIndex % 12];

  return {
    year, month, day, isLeap, ganZhiYear, zodiac,
    lunarMonth: (isLeap ? '闰' : '') + MONTH_CN[month - 1] + '月',
    lunarDay: DAY_CN[day - 1],
  };
}

// 公历节日（固定月-日）
const SOLAR_FESTIVALS = {
  '1-1': '元旦', '2-14': '情人节', '3-8': '妇女节', '3-12': '植树节',
  '4-1': '愚人节', '5-1': '劳动节', '5-4': '青年节', '6-1': '儿童节',
  '7-1': '建党节', '8-1': '建军节', '9-10': '教师节', '10-1': '国庆节',
  '12-24': '平安夜', '12-25': '圣诞节',
};

// 农历节日（闰月不匹配）
const LUNAR_FESTIVALS = {
  '1-1': '春节', '1-15': '元宵节', '2-2': '龙抬头',
  '5-5': '端午节', '7-7': '七夕节', '7-15': '中元节',
  '8-15': '中秋节', '9-9': '重阳节',
  '12-8': '腊八节', '12-23': '小年',
};

// 24 节气名
const SOLAR_TERMS = ['小寒', '大寒', '立春', '雨水', '惊蛰', '春分', '清明', '谷雨',
  '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑',
  '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至'];

// 2026 年基准节气日期表（每月两个：月初节气、月中节气），±1 天宽松匹配
const SOLAR_TERM_DATES_2026 = [
  [5, 20], [4, 19], [5, 20], [5, 20], [5, 21], [5, 21],
  [7, 23], [7, 23], [7, 23], [8, 23], [7, 22], [7, 22],
];

/** 取节气（近似查表法，覆盖常见场景） */
function getSolarTerm(date) {
  const month = date.getMonth();
  const day = date.getDate();
  const [firstDay, secondDay] = SOLAR_TERM_DATES_2026[month];
  if (Math.abs(day - firstDay) <= 1) return SOLAR_TERMS[month * 2];
  if (Math.abs(day - secondDay) <= 1) return SOLAR_TERMS[month * 2 + 1];
  return null;
}

/**
 * 节日 = 公历节日 + 农历节日 + 节气节日 + 除夕
 * @param {Date} date
 * @param {ReturnType<typeof solarToLunar>} lunar
 * @returns {string[]}
 */
function getFestivals(date, lunar) {
  const festivals = [];
  const m = date.getMonth() + 1;
  const d = date.getDate();

  if (SOLAR_FESTIVALS[`${m}-${d}`]) festivals.push(SOLAR_FESTIVALS[`${m}-${d}`]);
  if (!lunar.isLeap && LUNAR_FESTIVALS[`${lunar.month}-${lunar.day}`]) {
    festivals.push(LUNAR_FESTIVALS[`${lunar.month}-${lunar.day}`]);
  }
  const term = getSolarTerm(date);
  if (term === '清明') festivals.push('清明节');
  if (term === '冬至') festivals.push('冬至');
  if (lunar.month === 12 && lunar.day === monthDays(lunar.year, 12)) {
    festivals.push('除夕');
  }
  return festivals;
}

/** 快捷：根据 Date 返回农历+节日聚合信息 */
function getDayInfo(date) {
  const lunar = solarToLunar(date);
  return {
    lunar,
    festivals: getFestivals(date, lunar),
    solarTerm: getSolarTerm(date),
  };
}

// ============================================================

// futureevents.js — 未来可公布的重大事件 / 科技大事

// isEstimated：true 时 UI 显示「预计/计划」标签

/** 判断某日期命中的未来事件 */
function getFutureEventsForDate(date) {
  const key = formatLocalDate(date);
  return FUTURE_EVENTS.filter((ev) => key >= ev.startDate && key <= ev.endDate);
}

// ============================================================
// app.js — 日历主逻辑（普通脚本版，由 build.py 内联进 index.html）
// 依赖：lunar.js / data/*.js 先于本文件加载（同一作用域）
// ============================================================

(function () {
  'use strict';

  var WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
  var today = getLocalToday();

  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth(); // 0-based
  var lastTodayKey;

  function $(id) { return document.getElementById(id); }

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  lastTodayKey = fmtKey(today);
  function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

  function buildMonthMatrix(year, month) {
    var firstDay = new Date(year, month, 1);
    var startWeekday = firstDay.getDay();
    var weeks = [];
    for (var w = 0; w < 6; w++) {
      var week = [];
      for (var d = 0; d < 7; d++) {
        var offset = w * 7 + d;
        week.push(new Date(year, month, 1 - startWeekday + offset));
      }
      weeks.push(week);
    }
    return weeks;
  }

  function render() {
    $('weekdayRow').innerHTML = WEEKDAYS.map(function (w) { return '<span>' + w + '</span>'; }).join('');
    $('monthTitle').textContent = viewYear + '年' + (viewMonth + 1) + '月';

    var hotCount = 0, holidayCount = 0;
    var matrix = buildMonthMatrix(viewYear, viewMonth);
    matrix.forEach(function (week) {
      week.forEach(function (d) {
        var key = fmtKey(d);
        if (historicalEventMap.has(key) || getFutureEventsForDate(d).length > 0) hotCount++;
        var h = holidayMap.get(key);
        if (h && h.type === 'holiday') holidayCount++;
      });
    });
    $('summary').textContent = '🔥 ' + hotCount + '天热点 · 🏖 ' + holidayCount + '天假期';

    var html = '';
    matrix.forEach(function (week) {
      week.forEach(function (d) {
        var key = fmtKey(d);
        var dayInfo = getDayInfo(d);
        var lunar = dayInfo.lunar;
        var holiday = holidayMap.get(key);
        var historical = historicalEventMap.get(key);
        var future = getFutureEventsForDate(d);

        var classes = ['day'];
        if (d.getMonth() !== viewMonth) classes.push('other-month');
        if (isSameDay(d, today)) classes.push('today');
        if (holiday && holiday.type === 'holiday') classes.push('holiday-bg');

        var badges = '';
        if (holiday) badges += '<span class="badge ' + (holiday.type === 'holiday' ? 'holiday' : 'workday') + '">' + (holiday.type === 'holiday' ? '休' : '班') + '</span>';
        if (historical || future.length) badges += '<span class="badge hot">热点</span>';

        var festival = dayInfo.festivals[0] ? '<div class="festival">' + dayInfo.festivals[0] + '</div>' : '';
        var hotTitle = historical
          ? '<div class="hot-title">' + (historical.hotEvents[0] ? historical.hotEvents[0].title : '') + '</div>'
          : (future[0] ? '<div class="hot-title">' + future[0].title + '</div>' : '');

        html += '<div class="' + classes.join(' ') + '" data-date="' + key + '">' +
          '<div class="num">' + d.getDate() + '</div>' +
          '<div class="lunar">' + lunar.lunarDay + '</div>' +
          '<div class="badges">' + badges + '</div>' +
          festival +
          hotTitle +
          '</div>';
      });
    });
    $('grid').innerHTML = html;

    var days = document.querySelectorAll('.day');
    for (var i = 0; i < days.length; i++) {
      days[i].addEventListener('click', (function (el) {
        return function () { openDrawer(parseLocalDate(el.getAttribute('data-date'))); };
      })(days[i]));
    }
  }

  function openDrawer(date) {
    var key = fmtKey(date);
    var dayInfo = getDayInfo(date);
    var lunar = dayInfo.lunar;
    var holiday = holidayMap.get(key);
    var historical = historicalEventMap.get(key);
    var future = getFutureEventsForDate(date);

    $('drawerTitle').textContent = date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日 星期' + WEEKDAYS[date.getDay()];

    var body = '';
    body += '<div class="info-block"><div class="label">农历 · 节日</div><div class="content">' +
      lunar.lunarMonth + lunar.lunarDay + ' · ' + lunar.ganZhiYear + '年 · 属' + lunar.zodiac +
      (dayInfo.solarTerm ? '<span class="chip">' + dayInfo.solarTerm + '</span>' : '') +
      dayInfo.festivals.map(function (f) { return '<span class="chip">' + f + '</span>'; }).join('') +
      (holiday ? '<span class="chip ' + (holiday.type === 'workday' ? 'est' : '') + '">' + holiday.name + '（' + (holiday.type === 'holiday' ? '放假' : '调休上班') + '）</span>' : '') +
      '</div></div>';

    if (historical || future.length) {
      body += '<div class="info-block"><div class="label">🔥 当日热点</div>';
      if (historical) {
        historical.hotEvents.forEach(function (e) {
          body += '<div class="event-item"><span class="idx">' + e.index + '</span>' + e.title + '</div>';
        });
      }
      future.slice(0, 3).forEach(function (e, i) {
        var sectors = e.relatedSectors && e.relatedSectors.length
          ? '<div class="sector-hint">可能关注方向：' + e.relatedSectors.map(function (sector) { return '<span class="chip sector">' + sector + '</span>'; }).join('') + '</div>'
          : '';
        body += '<div class="event-item"><span class="idx">' + (i + 1) + '</span>' + e.title + (e.description ? ' — ' + e.description : '') + (e.isEstimated ? ' <span class="chip est">预计</span>' : '') + sectors + '</div>';
      });
      body += '</div>';
    }

    body += '<div class="info-block"><div class="label">📊 Excel 分析报告</div>';
    if (historical && historical.excelDownloadUrl) {
      body += '<a class="download-btn" href="' + historical.excelDownloadUrl + '" target="_blank" rel="noreferrer">⬇ 下载 Excel 分析报告（' + key + '）</a>';
    } else {
      body += '<div class="placeholder">' + (key < fmtKey(today) ? '暂无历史数据' : '未来日期敬请期待') + '</div>';
    }
    body += '</div>';

    $('drawerBody').innerHTML = body;
    $('overlay').classList.add('show');
    $('drawer').classList.add('show');
  }

  function refreshToday() {
    var nextToday = getLocalToday();
    var nextKey = fmtKey(nextToday);
    if (nextKey === lastTodayKey) return;
    today = nextToday;
    lastTodayKey = nextKey;
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    render();
  }

  function closeDrawer() {
    $('overlay').classList.remove('show');
    $('drawer').classList.remove('show');
  }

  $('btnPrev').addEventListener('click', function () { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(); });
  $('btnNext').addEventListener('click', function () { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render(); });
  $('btnToday').addEventListener('click', function () { today = getLocalToday(); viewYear = today.getFullYear(); viewMonth = today.getMonth(); render(); openDrawer(new Date(today)); });
  $('drawerClose').addEventListener('click', closeDrawer);
  $('overlay').addEventListener('click', closeDrawer);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshToday(); });
  window.addEventListener('focus', refreshToday);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') $('btnPrev').click();
    if (e.key === 'ArrowRight') $('btnNext').click();
    if (e.key === 'Escape') closeDrawer();
  });

  render();
})();

</script>
